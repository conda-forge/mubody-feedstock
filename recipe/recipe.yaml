schema_version: 1

context:
  version: "0.4.0"
  python_min: "3.12"
package:
  name: mubody
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mubody/mubody-${{ version }}.tar.gz
  sha256: 271d6b8ae743f8502a803276c64ecceb8ff16c2f78aaa501b313208df53bb4f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=69
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.7
    - spiceypy >=6.0
    - numba >=0.58

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - mubody
      pip_check: true

about:
  summary: Multi-body dynamics in libration points
  license: MIT
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/mubody/

extra:
  recipe-maintainers:
    - JuanBermejo
