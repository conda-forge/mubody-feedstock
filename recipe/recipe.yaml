schema_version: 1

context:
  version: "0.1.2"

package:
  name: mubody
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mubody/mubody-${{ version }}.tar.gz
  sha256: c5bc93d6ea7264d90d9770f0cf4a1cbda108a25d4fb65d5ffacb43011784389e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=69
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.7
    - spiceypy >=6.0
    - numba >=0.58
    - requests >=2.31

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - mubody
      pip_check: true

about:
  summary: Multi-body dynamics in libration points
  license: MIT
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/mubody/

extra:
  recipe-maintainers:
    - JuanBermejo
