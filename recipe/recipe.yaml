schema_version: 1

context:
  version: "0.1.1"
  python_min: "3.11"

package:
  name: mubody
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mubody/mubody-${{ version }}.tar.gz
  sha256: 8bf2c7ab662c67781fed82d01ff44e6c09f4889b388185461182f2c3b2f75a4f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=69
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.7
    - spiceypy >=6.0
    - numba >=0.58
    - requests >=2.31

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - mubody
      pip_check: true

about:
  summary: Multi-body dynamics in libration points
  license: MIT
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/mubody/

extra:
  recipe-maintainers:
    - JuanBermejo
